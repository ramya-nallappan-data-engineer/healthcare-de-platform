name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  AIRFLOW_VERSION: "3.3.2"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Airflow (with constraints)
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - name: Install Databricks provider and pytest
        run: pip install "apache-airflow-providers-databricks==7.23.0" "pytest==9.2.0"
      - name: Check dependencies and show versions
        run: |
          pip check
          pip freeze | grep -i -E "^(apache-airflow==|apache-airflow-providers-databricks==|pytest==)"
      - name: Run tests
        run: python -m pytest tests -v
